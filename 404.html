<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dinverno Remodeling &amp; Construction — 20% OFF + 0% Financing</title>
  <meta property="og:title" content="Dinverno Remodeling — Claim 20% OFF + 0% Interest Financing">
  <meta property="og:description" content="1-Tap Free Estimate Booking with Dinverno Remodeling &amp; Construction.">
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0f172a; color:#f8fafc; display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:20px; }
    .card { background:#1e293b; border:1px solid #334155; border-radius:16px; padding:32px 24px; max-width:400px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,0.4); }
    .badge { display:inline-block; background:#f59e0b; color:#0f172a; font-weight:800; font-size:12px; padding:4px 12px; border-radius:999px; margin-bottom:14px; letter-spacing:0.5px; }
    h1 { font-size:20px; margin:0 0 8px; color:#fff; }
    p { font-size:14px; color:#94a3b8; margin:0 0 20px; }
    .spinner { width:36px; height:36px; border:3px solid #334155; border-top-color:#f59e0b; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">20% OFF + 0% INTEREST FINANCING</div>
    <h1>Dinverno Remodeling &amp; Construction</h1>
    <p>Opening your personalized estimate scheduler...</p>
    <div class="spinner"></div>
  </div>
  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      let phone = params.get('p') || params.get('phone') || '';
      if (!phone) {
        const m = (window.location.pathname + window.location.search + window.location.hash).match(/(\d{10})/);
        if (m) phone = m[1];
      }
      let base = 'https://stylish-premiere-reproduce-pepper.trycloudflare.com';
      try {
        const res = await fetch('https://raw.githubusercontent.com/drcinc340/dinverno-remodeling/main/tunnel.json?t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.tunnelUrl) base = data.tunnelUrl.replace(/\/$/, '');
        }
      } catch (e) {}
      const target = phone ? (base + '/k/' + phone) : (base + '/schedule');
      window.location.replace(target);
    })();
  </script>
</body>
</html>
